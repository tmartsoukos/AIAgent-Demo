services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ragdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Το depends_on από μόνο του περιμένει μόνο να ξεκινήσει ο container, όχι
    # να είναι έτοιμη η βάση — το healthcheck καλύπτει τη διαφορά.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ragdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    environment:
      # Υπερισχύει του DATABASE_URL του .env: μέσα στο compose network η βάση
      # είναι στο hostname "db", ενώ το localhost θα ήταν ο ίδιος ο container.
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ragdb
      # Το origin απ' όπου φορτώνει ο browser το frontend. Τοπικά είναι το
      # localhost· στο EC2 η public διεύθυνση. Ορίζεται στο root .env.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Ψήνεται στο client bundle κατά το build. Είναι η διεύθυνση που θα
        # καλέσει ο browser του χρήστη, όχι κάποιο εσωτερικό service name —
        # γι' αυτό στο EC2 πρέπει να είναι η public IP, όχι το localhost.
        # Αλλαγή τιμής απαιτεί rebuild (--build), όχι απλό restart.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Εδώ αποθηκεύονται τα πιστοποιητικά — χωρίς persistent volume το Caddy
      # θα ζητούσε καινούριο σε κάθε restart και θα χτυπούσε τα όρια της Let's Encrypt.
      - caddy_data:/data
      - caddy_config:/config
    environment:
      # Χωρίς τιμή: σκέτο HTTP στο :80, χρήσιμο τοπικά.
      # Με domain: αυτόματο HTTPS από Let's Encrypt.
      DOMAIN: ${DOMAIN:-:80}
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
  caddy_data:
  caddy_config:
